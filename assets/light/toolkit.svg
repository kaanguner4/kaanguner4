<svg xmlns="http://www.w3.org/2000/svg" width="880" height="488" viewBox="0 0 880 488" role="img" aria-labelledby="t d"><title id="t">Toolkit</title><desc id="d">Programming: PYTHON, SQL, JAVA, C / C++, C#, TYPESCRIPT, SWIFT. Machine Learning: SCIKIT-LEARN, LIGHTGBM, XGBOOST, PANDAS, NUMPY, SCIPY, ANOMALY DETECTION, TIME-SERIES, NEAT. Research: STATISTICAL TESTING, DIFFERENTIAL PRIVACY, TOPSIS, MNE-PYTHON, REPRODUCIBLE PIPELINES. Llm Engineering: MULTI-MODEL ROUTING, LLM EVALUATION, TEXT-TO-SQL, GROQ, GEMINI, CLAUDE API, CLAUDE CODE, CODEX. Backend &amp; Infra: FASTAPI, SQLALCHEMY, POSTGRESQL, REDIS, WEBSOCKETS, JWT · RBAC, DOCKER, GITHUB ACTIONS, LINUX, CLOUDFLARE WORKERS, SUPABASE. Testing: PYTEST, SELENIUM, INTEGRATION &amp; E2E, CI COVERAGE GATES</desc><defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-weight:500}.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style></defs><text x="0" y="34" class="m" font-size="10.5" letter-spacing="1.4" fill="#6b7280">PROGRAMMING</text><rect x="250.0" y="18" width="64.3" height="24" rx="12.0" fill="#f9fafb" stroke="#e5e7eb"/><text x="261.0" y="34" class="m" fill="#4b5563" font-size="10.5" letter-spacing="0.9">PYTHON</text><rect x="321.3" y="18" width="42.7" height="24" rx="12.0" fill="#f9fafb" stroke="#e5e7eb"/><text x="332.3" y="34" class="m" fill="#4b5563" font-size="10.5" letter-spacing="0.9">SQL</text><rect x="371.0" y="18" width="49.9" height="24" rx="12.0" fill="#f9fafb" stroke="#e5e7eb"/><text x="382.0" y="34" class="m" fill="#4b5563" font-size="10.5" letter-spacing="0.9">JAVA</text><rect x="427.9" y="18" width="71.5" height="24" rx="12.0" fill="#f9fafb" stroke="#e5e7eb"/><text x="438.9" y="34" class="m" fill="#4b5563" font-size="10.5" letter-spacing="0.9">C / C++</text