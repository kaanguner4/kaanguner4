<svg xmlns="http://www.w3.org/2000/svg" width="880" height="830" viewBox="0 0 880 830" role="img" aria-labelledby="t d"><title id="t">Experience and education</title><desc id="d">Student Researcher · Tübi̇tak 1002 at Antalya Bilim University, 09/2026 — PRESENT. Research on Local Differential Privacy for EEG data: how much utility each feature keeps, and how to choose the privacy budget (ε) per feature. Built the feature pipeline on the STEW workload dataset (48 participants, 22 EEG features) and delivered the utility stage as a reproducible 108-file package. Machine Learning Engineer Intern · R&amp;D / Iot Team at Enelsa, 06/2026 — 07/2026. Designed and built, alone and end to end, the Water Anomaly Detection System for an industrial water treatment line, and took it live as an MVP with a real-time monitoring dashboard. Rare critical events had too little data for automated alerts, so that part moved to explainable rules and the limit was documented in the final report. Computer Engineer Intern at i2i Systems, 06/2025 — 07/2025. Built working components on 6 enterprise platforms in the intern engineering program: a Java/JDBC data loader, a 10,000-object Hazelcast map and a 5-endpoint REST API with Selenium end-to-end tests. Tested the team's telecom Online Charging System. Game Developer Intern at Masomo Gaming, 08/2024 — 10/2024. Learned Unity and C# from zero and shipped 2 games: a 2D action platformer with 20 scripts across 6 systems, and JustDrift, a 3D mobile driving game with an online REST leaderboard.</desc><defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-weight:500}.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style></defs><text x="0" y="34" font-size="19" font-weight="700" letter-spacing="-.3" fill="#f